<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%" style="background:#0b1220;border-radius:22px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">
  <defs>
    <linearGradient id="lp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f52ff" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="lp-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#0f1624" />
    </linearGradient>
  </defs>

  <!-- Android status bar -->
  <text x="22" y="24" fill="#a1a1aa" font-size="11" font-weight="600">09:41</text>
  <path d="M296 16h3v8h-3zM302 14h3v10h-3zM308 12h3v12h-3z" fill="#a1a1aa" />
  <rect x="316" y="13" width="22" height="11" rx="3" fill="none" stroke="#a1a1aa" stroke-width="1.2" />
  <rect x="318" y="15" width="14" height="7" rx="1.5" fill="#a1a1aa" />

  <!-- App bar -->
  <rect x="18" y="40" width="36" height="36" rx="11" fill="#1e1b4b" />
  <path d="M36 52l-6 6 6 6" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="64" y="56" fill="#ffffff" font-size="16" font-weight="700">Limpapp</text>
  <text x="64" y="71" fill="#c084fc" font-size="10" font-weight="600">Kotlin · Jetpack Compose</text>

  <!-- Service card -->
  <rect x="18" y="90" width="324" height="152" rx="16" fill="url(#lp-card)" stroke="#27272a" stroke-width="1" />
  <text x="34" y="118" fill="#ffffff" font-size="15" font-weight="700">Higienizacao Residencial</text>
  <text x="34" y="136" fill="#a1a1aa" font-size="11">Profissional: Claudia Santos (4.9)</text>
  <text x="34" y="153" fill="#71717a" font-size="11">Hoje, 14:00 - Salvador, BA</text>

  <rect x="34" y="168" width="92" height="58" rx="8" fill="#1e293b" stroke="#3f3f46" stroke-width="1" />
  <text x="80" y="201" fill="#a1a1aa" font-size="10" text-anchor="middle">Antes</text>
  <rect x="134" y="168" width="92" height="58" rx="8" fill="#1e293b" stroke="#7f52ff" stroke-width="1" />
  <text x="180" y="201" fill="#c084fc" font-size="10" text-anchor="middle">Depois</text>
  <rect x="234" y="168" width="92" height="58" rx="8" fill="#2e1065" stroke="#7f52ff" stroke-width="1" stroke-dasharray="4 3" />
  <text x="280" y="193" fill="#c084fc" font-size="17" text-anchor="middle">+</text>
  <text x="280" y="211" fill="#c084fc" font-size="9" text-anchor="middle">Add foto</text>

  <!-- Upload button -->
  <rect x="18" y="256" width="324" height="46" rx="14" fill="url(#lp-grad)" />
  <text x="180" y="284" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Enviar foto ilustrativa do servico</text>

  <!-- Offline sync -->
  <rect x="18" y="314" width="324" height="96" rx="16" fill="url(#lp-card)" stroke="#27272a" stroke-width="1" />
  <circle cx="42" cy="344" r="14" fill="#065f46" />
  <path d="M36 344l4 4 8-8" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="68" y="340" fill="#ffffff" font-size="13" font-weight="600">Sincronizacao offline ativa</text>
  <text x="68" y="357" fill="#a1a1aa" font-size="10.5">Persistencia local com Room Database</text>
  <text x="68" y="390" fill="#38bdf8" font-size="11" font-weight="600">Backend: Java 21 / Spring Boot 3</text>

  <!-- Bottom navigation -->
  <rect x="0" y="580" width="360" height="60" fill="#0b0f19" stroke="#1f2937" stroke-width="1" />
  <circle cx="70" cy="604" r="4" fill="#7f52ff" />
  <text x="70" y="622" fill="#c084fc" font-size="9" text-anchor="middle">Inicio</text>
  <circle cx="180" cy="604" r="4" fill="#71717a" />
  <text x="180" y="622" fill="#71717a" font-size="9" text-anchor="middle">Servicos</text>
  <circle cx="290" cy="604" r="4" fill="#71717a" />
  <text x="290" y="622" fill="#71717a" font-size="9" text-anchor="middle">Galeria</text>
</svg>
