server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
  shutdown: graceful

spring:
  application:
    name: portfolio-backend
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    locale-resolver: accept_header
  web:
    locale: pt
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

portfolio:
  contact:
    recipient: ${CONTACT_RECIPIENT:reinaldobarretosilva@gmail.com}
    enabled: ${CONTACT_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: Portfolio Backend
    description: Reinaldo Barreto da Silva - Portfolio API
    version: 1.0.0
    contact: reinaldobarretosilva@gmail.com

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: true

logging:
  level:
    root: INFO
    com.reinaldobarreto.portfolio: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
