profile.summary=Engenheiro de Software com sólida trajetória no ecossistema Java/Spring Boot, Python/Django, FastAPI, Node.js/Nest.js e desenvolvimento avançado em Go. Especialista em sistemas críticos para o setor público (Estadual, Municipal e Segurança Pública). Une desenvolvimento de alta complexidade com práticas de DevOps, SRE e Infraestrutura.
profile.objective=Atuar como Engenheiro de Software | DevOps & SRE | Full Stack, aplicando expertise em Java, Spring Boot, Python e expandindo conhecimento prático em Go, em projetos que demandem performance e escalabilidade.
profile.location=Navegantes, Santa Catarina - SC

