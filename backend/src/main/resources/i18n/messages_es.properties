profile.summary=Ingeniero de Software con sólida trayectoria en el ecosistema Java/Spring Boot, Python/Django, FastAPI, Node.js/Nest.js y desarrollo avanzado en Go. Especialista en sistemas críticos para el sector público (Estatal, Municipal y Seguridad Pública). Combina desarrollo de alta complejidad con prácticas de DevOps, SRE e Infraestructura.
profile.objective=Actuar como Ingeniero de Software | DevOps & SRE | Full Stack, aplicando experiencia en Java, Spring Boot, Python y ampliando conocimiento práctico en Go en proyectos que demanden rendimiento y escalabilidad.
profile.location=Navegantes, Santa Catarina - Brasil

