<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%" style="background:#0b1220;border-radius:22px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">
  <defs>
    <linearGradient id="nf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Android status bar -->
  <text x="22" y="24" fill="#a1a1aa" font-size="11" font-weight="600">09:41</text>
  <path d="M296 16h3v8h-3zM302 14h3v10h-3zM308 12h3v12h-3z" fill="#a1a1aa" />
  <rect x="316" y="13" width="22" height="11" rx="3" fill="none" stroke="#a1a1aa" stroke-width="1.2" />
  <rect x="318" y="15" width="14" height="7" rx="1.5" fill="#a1a1aa" />

  <text x="22" y="62" fill="#ffffff" font-size="18" font-weight="800">NotaFacil</text>
  <text x="22" y="80" fill="#c4b5fd" font-size="10.5">Android · Kotlin · ML Kit · CameraX</text>

  <!-- Camera preview -->
  <rect x="18" y="96" width="324" height="230" rx="18" fill="#111827" stroke="#334155" stroke-width="1" />
  <rect x="60" y="140" width="240" height="150" rx="10" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="12 8" />
  <text x="180" y="130" fill="#c4b5fd" font-size="12" text-anchor="middle">Posicione a nota fiscal</text>
  <rect x="40" y="200" width="280" height="4" rx="2" fill="url(#nf-grad)" />
  <text x="180" y="312" fill="#94a3b8" font-size="11" text-anchor="middle">Detectando codigo de barras / QR Code</text>

  <!-- Result card -->
  <rect x="18" y="340" width="324" height="120" rx="16" fill="#141c2e" stroke="#27272a" stroke-width="1" />
  <circle cx="44" cy="368" r="12" fill="#065f46" />
  <path d="M39 368l3.5 3.5 7-7" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="68" y="372" fill="#ffffff" font-size="13" font-weight="600">Nota lida com sucesso</text>
  <text x="34" y="400" fill="#a1a1aa" font-size="11">Emitente: Mercado Central LTDA</text>
  <text x="34" y="420" fill="#a1a1aa" font-size="11">CNPJ: 12.345.678/0001-90</text>
  <text x="34" y="442" fill="#c084fc" font-size="13" font-weight="700">Total: R$ 187,45</text>

  <!-- Scan button -->
  <rect x="18" y="476" width="324" height="48" rx="14" fill="url(#nf-grad)" />
  <text x="180" y="505" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Escanear nova nota</text>
</svg>
