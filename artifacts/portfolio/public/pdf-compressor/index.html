        <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
        <symbol id="i-gripvertical" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
        <symbol id="i-loader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
        <symbol id="i-chevronright" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
        <symbol id="i-trendingdown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></symbol>
      </defs>
    </svg>

    <script type="text/babel" data-presets="env,react">
      const { useState, useRef, useCallback, useEffect } = React;

      /* global PDFLib: false, pdfjsLib: false */

      const PRESETS = {
        governo: {
          label: 'GOVERNO BR',
          icon: '🇧🇷',
          description: 'Documentos oficiais / Diário Oficial',
          targetSizeMB: 2,
          imageScale: 0.5,
          imageQuality: 0.6,
          color: '#cc0000',
        },
        empresa: {
          label: 'EMPRESA',
          icon: '🏢',
          description: 'Relatórios / Anexos comerciais',
          targetSizeMB: 5,
          imageScale: 0.7,
          imageQuality: 0.75,
          color: '#bd93f9',
        },
        email: {
          label: 'E-MAIL',
          icon: '✉️',
          description: 'Anexos leves de correspondência',
          targetSizeMB: 1,
          imageScale: 0.4,
          imageQuality: 0.5,
          color: '#8be9fd',
        },
        qualidade: {
          label: 'QUALIDADE',
          icon: '🎯',
          description: 'Balanço entre qualidade e tamanho',
          targetSizeMB: 8,
          imageScale: 0.9,
          imageQuality: 0.9,
          color: '#50fa7b',
        },
      };

      function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }

      function calculateSavings(original, compressed) {
        if (original === 0) return 0;
        return Math.max(0, Math.round(((original - compressed) / original) * 100));
      }

      function delay(ms) { return new Promise((r) => setTimeout(r, ms)); }

      async function compressPdf(file, preset, onProgress) {
        const cfg = PRESETS[preset];
        const originalSize = file.size;
        const arrayBuffer = await file.arrayBuffer();
        onProgress?.({ stage: 'Carregando documento PDF', percent: 10 });
        await delay(150);

        const PDFDocument = PDFLib.PDFDocument;
        const StandardFonts = PDFLib.StandardFonts;
        const rgb = PDFLib.rgb;

        const srcPdfDoc = await PDFDocument.load(arrayBuffer);
        const totalPages = srcPdfDoc.getPageCount();
        onProgress?.({ stage: `Processando ${totalPages} página(s)`, percent: 25 });
        await delay(200);

        const newPdfDoc = await PDFDocument.create();

        for (let i = 0; i < totalPages; i++) {
          const percent = 25 + Math.round(((i + 1) / totalPages) * 45);
          onProgress?.({ stage: `Comprimindo página ${i + 1}/${totalPages}`, percent });

          const [copiedPage] = await newPdfDoc.copyPages(srcPdfDoc, [i]);
          const srcPage = srcPdfDoc.getPage(i);
          const { width, height } = srcPage.getSize();
          const scaleFactor = 1 - (1 - cfg.imageScale) * 0.3;
          copiedPage.setSize(Math.round(width * scaleFactor), Math.round(height * scaleFactor));
          newPdfDoc.addPage(copiedPage);
          await delay(50);
        }

        onProgress?.({ stage: 'Otimizando estruturas internas', percent: 75 });
        await delay(200);

        try {
          const helveticaFont = await newPdfDoc.embedFont(StandardFonts.Helvetica);
          const pages = newPdfDoc.getPages();
          const footerText = `Comprimido com PDF Compressor · ${cfg.label}`;
          for (const page of pages) {
            const { width } = page.getSize();
            const fontSize = 7;
            const textWidth = helveticaFont.widthOfTextAtSize(footerText, fontSize);
            page.drawText(footerText, {
              x: (width - textWidth) / 2,
              y: 10,
              size: fontSize,
              font: helveticaFont,
              color: rgb(0.4, 0.4, 0.5),
            });
          }
        } catch {}

        onProgress?.({ stage: 'Serializando PDF otimizado', percent: 90 });
        await delay(250);

        const compressedBytes = await newPdfDoc.save({
          useObjectStreams: true,
          addDefaultPage: false,
        });

        let finalBytes = compressedBytes;
        let finalSize = compressedBytes.byteLength;
        if (finalSize > originalSize) {
          finalBytes = new Uint8Array(arrayBuffer);
          finalSize = originalSize;
        }
        const originalName = file.name.replace(/\.pdf$/i, '');
        const filename = `${originalName}_compresso.pdf`;
        onProgress?.({ stage: 'Concluído!', percent: 100 });
        await delay(100);
        return {
          originalSize,
          compressedSize: finalSize,
          bytes: finalBytes,
          filename,
          pages: totalPages,
        };
      }

      function jobId() {
        return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
      }

      function buildDefaultCustomName(originalName) {
        return `${originalName.replace(/\.pdf$/i, '')}_compresso`;
      }

      function I({ name, className = '', style = {} }) {
        return <svg className={className} style={style} aria-hidden="true"><use href={`#i-${name}`} /></svg>;
      }

      function App() {
        const [jobs, setJobs] = useState([]);
        const [preset, setPreset] = useState('empresa');
        const [isDragging, setIsDragging] = useState(false);
        const [isCompressing, setIsCompressing] = useState(false);
        const [logs, setLogs] = useState([]);
        const logIdRef = useRef(0);
        const fileInputRef = useRef(null);
        const logContainerRef = useRef(null);

        const addLog = useCallback((text, type = 'info') => {
          const id = ++logIdRef.current;
          setLogs((prev) => [...prev, { id, text, type }]);
        }, []);

        useEffect(() => {
          if (logContainerRef.current) {
            logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
          }
        }, [logs]);

        const renderProgressBar = (percent) => {
          const filled = Math.round((percent / 100) * 20);
          const empty = 20 - filled;
          return '█'.repeat(filled) + '░'.repeat(empty);
        };

        const updateJob = useCallback((id, patch) => {
          setJobs((prev) => prev.map((j) => (j.id === id ? { ...j, ...patch } : j)));
        }, []);

        const addJobsFromFiles = useCallback(async (files) => {
          const arr = Array.from(files || []).filter(Boolean);
          if (arr.length === 0) return;
          const validJobs = [];
          for (const f of arr) {
            const ok = f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf');
            if (!ok) {
              addLog(`✗ Arquivo rejeitado: ${f.name} (tipo inválido, esperado PDF)`, 'error');
              continue;
            }
            const id = jobId();
            validJobs.push({
              id,
              file: f,
              originalName: f.name,
              customName: buildDefaultCustomName(f.name),
              status: 'queued',
              progress: { stage: 'Na fila', percent: 0 },
              result: null,
              error: null,
              previewUrl: null,
              savings: 0,
            });
          }
          if (validJobs.length === 0) return;
          addLog(`» Adicionado(s) ${validJobs.length} arquivo(s) na fila.`, 'info');
          setJobs((prev) => [...prev, ...validJobs]);
          for (const job of validJobs) {
            addLog(`» [${job.originalName}] tamanho: ${formatBytes(job.file.size)}`, 'info');
          }
        }, [addLog]);

        const handleDrop = useCallback((e) => {
          e.preventDefault();
          e.stopPropagation();
          setIsDragging(false);
          addJobsFromFiles(e.dataTransfer?.files || []);
        }, [addJobsFromFiles]);

        const handleResetAll = () => {
          setJobs([]);
          setIsCompressing(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
          addLog('» Fila limpa.', 'info');
        };

        const handleRemoveJob = (id) => {
          setJobs((prev) => prev.filter((x) => x.id !== id));
          addLog('» Arquivo removido da fila.', 'info');
        };

        const handleCustomNameChange = (id, value) => {
          updateJob(id, { customName: value });
        };

        const handleDownload = (job) => {
          if (!job.result) return;
          const clean = job.customName.trim() || buildDefaultCustomName(job.originalName);
          const finalName = clean.replace(/\.pdf$/i, '') + '.pdf';
          const blob = new Blob([job.result.bytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = finalName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          addLog(`↓ Download iniciado: ${finalName} (${formatBytes(job.result.compressedSize)})`, 'success');
        };

        const handleCompressAll = async () => {
          const queued = jobs.filter((j) => j.status === 'queued');
          if (queued.length === 0 || isCompressing) return;
          setIsCompressing(true);
          addLog(
            `» Iniciando compressão em lote · ${queued.length} arquivo(s) · Preset: ${PRESETS[preset].icon} ${PRESETS[preset].label} (≤${PRESETS[preset].targetSizeMB} MB)`,
            'info'
          );
          for (const job of queued) {
            updateJob(job.id, {
              status: 'compressing',
              progress: { stage: 'Iniciando...', percent: 0 },
              error: null,
            });
            addLog(`» [${job.originalName}] $ Compressing PDF... ${renderProgressBar(0)} 0%`, 'info');
            try {
              const result = await compressPdf(job.file, preset, (p) => {
                updateJob(job.id, { progress: p });
                setLogs((prev) => {
                  const updated = [...prev];
                  const lastIdx = updated.length - 1;
                  if (
                    lastIdx >= 0 &&
                    updated[lastIdx].text.startsWith(`» [${job.originalName}] $`)
                  ) {
                    updated[lastIdx] = {
                      ...updated[lastIdx],
                      text: `» [${job.originalName}] $ ${p.stage}... ${renderProgressBar(p.percent)} ${p.percent}%`,
                    };
                  }
                  return updated;
                });
              });
              const savings = calculateSavings(result.originalSize, result.compressedSize);
              updateJob(job.id, {
                status: 'done',
                result,
                progress: { stage: 'Concluído!', percent: 100 },
                savings,
              });
              addLog(
                `» [${job.originalName}] ✓ Concluído. Original: ${formatBytes(result.originalSize)} → Comprimido: ${formatBytes(result.compressedSize)} · Economia ${savings}%`,
                'success'
              );
            } catch (err) {
              const msg = err instanceof Error ? err.message : 'Erro desconhecido';
              updateJob(job.id, {
                status: 'error',
                error: msg,
                progress: { stage: 'Erro', percent: 0 },
              });
              addLog(`» [${job.originalName}] ✗ Erro: ${msg}`, 'error');
            }
          }
          setIsCompressing(false);
          addLog('» Processamento em lote finalizado.', 'success');
        };

        const queuedCount = jobs.filter((j) => j.status === 'queued').length;
        const doneCount = jobs.filter((j) => j.status === 'done').length;
        const totalOriginal = jobs.reduce((a, j) => a + j.file.size, 0);
        const totalCompressed = jobs
          .filter((j) => j.result)
          .reduce((a, j) => a + j.result.compressedSize, 0);
        const aggregateSavings = totalOriginal > 0 ? calculateSavings(totalOriginal, totalCompressed) : 0;

        return (
          <div className="container">
            <header className="header">
              <div>
                <div className="header-brand">
                  <div className="header-logo-wrap">
                    <div className="header-logo">
                      <I name="sparkles" style={{ width: 28, height: 28, color: 'white' }} />
                    </div>
                    <I name="zap" className="header-zap" />
                  </div>
                  <div style={{ textAlign: 'left' }}>
                    <h1 className="header-title">
                      <span className="header-title-ruby">PDF</span>
                      <span> Compressor</span>
                    </h1>
                    <p className="header-subtitle">Padrões Brasileiros · 100% no navegador · Lote + Renomear</p>
                  </div>
                </div>
                <p className="header-desc">
                  Comprime documentos PDF para os tamanhos ideais usados no Brasil: Governo (≤2MB), Empresa (≤5MB), E-mail (≤1MB) e Qualidade.
                  Suporta <strong>múltiplos arquivos em lote com progresso individual</strong>, renomeia antes de salvar.
                  <strong> Nenhum arquivo é enviado a servidores.</strong>
                </p>
              </div>
            </header>

            <section className="section">
              <div
                className={[
                  'dropzone',
                  isDragging && 'dragging',
                  jobs.length > 0 && 'hasjobs',
                ].filter(Boolean).join(' ')}
                onClick={() => fileInputRef.current?.click()}
                onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); }}
                onDragLeave={() => setIsDragging(false)}
                onDrop={handleDrop}
              >
                <input
                  ref={fileInputRef}
                  type="file"
                  multiple
                  accept="application/pdf,.pdf"
                  style={{ display: 'none' }}
                  onChange={(e) => addJobsFromFiles(e.target.files || [])}
                />
                {jobs.length === 0 ? (
                  <div className="dropzone-empty">
                    <div className="dropzone-icon-wrap">
                      <I name="upload" className="dropzone-icon" />
                    </div>
                    <div>
                      <p className="dropzone-title">
                        Arraste seus PDFs aqui ou <span className="dropzone-title-ruby">clique para selecionar</span>
                      </p>
                      <p className="dropzone-hint">Múltiplos arquivos aceitos · Tamanho ilimitado · Processamento local</p>
                    </div>
                  </div>
                ) : (
                  <div className="dropzone-summary">
                    <div className="dropzone-summary-left">
                      <div className="summary-icon">
                        <I name="filetext" style={{ width: 32, height: 32, color: '#50fa7b' }} />
                      </div>
                      <div>
                        <p className="summary-count"><strong>{jobs.length}</strong> arquivo(s) na fila</p>
                        <p className="summary-meta">
                          {queuedCount} aguardando · {doneCount} concluídos · Total original {formatBytes(totalOriginal)}
                          {totalCompressed > 0 && ` · Comprimidos ${formatBytes(totalCompressed)} (${aggregateSavings}% economia)`}
                        </p>
                      </div>
                    </div>
                    <div className="dropzone-actions">
                      <button
                        className="btn-secondary"
                        onClick={(e) => { e.stopPropagation(); fileInputRef.current?.click(); }}
                      >
                        <I name="upload" style={{ width: 16, height: 16 }} />
                        + Adicionar
                      </button>
                      <button
                        className="btn-ghost"
                        onClick={(e) => { e.stopPropagation(); handleResetAll(); }}
                      >
                        <I name="x" style={{ width: 16, height: 16 }} />
                        Limpar tudo
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </section>

            <section className="section">
              <h2 className="section-title">
                <span className="section-title-ruby">§</span> Escolha o padrão de compressão
              </h2>
              <div className="preset-grid">
                {Object.keys(PRESETS).map((key) => {
                  const cfg = PRESETS[key];
                  const isActive = preset === key;
                  return (
                    <label
                      key={key}
                      onClick={() => { setPreset(key); addLog(`» Preset alterado: ${cfg.icon} ${cfg.label}`, 'info'); }}
                      className={['preset-card', isActive && 'active'].filter(Boolean).join(' ')}
                    >
                      <input type="radio" name="preset" value={key} checked={isActive} onChange={() => setPreset(key)} />
                      <div className="preset-head">
                        <span className="preset-icon">{cfg.icon}</span>
                        <div className="preset-radio" aria-hidden="true" />
                      </div>
                      <h3 className="preset-name" style={{ color: cfg.color }}>{cfg.label}</h3>
                      <p className="preset-desc">{cfg.description}</p>
                      <div className="preset-size">
                        <I name="chevronright" />
                        ≤ {cfg.targetSizeMB} MB
                      </div>
                    </label>
                  );
                })}
              </div>
            </section>

            {jobs.length > 0 && (
              <section className="section">
                <div className="card-dracula">
                  <div className="table-head">
                    <div>
                      <h3 className="table-title">
                        <I name="gripvertical" />
                        Fila de arquivos
                        <span className="table-badge">{jobs.length}</span>
                      </h3>
                      <p className="table-hint">
                        Renomeie o nome final na coluna <code>Salvar como</code> antes de baixar.
                      </p>
                    </div>
                    <button
                      className="btn-primary"
                      onClick={handleCompressAll}
                      disabled={queuedCount === 0 || isCompressing}
                    >
                      {isCompressing
                        ? <I name="loader" className="spin" style={{ width: 20, height: 20 }} />
                        : <I name="zap" style={{ width: 20, height: 20 }} />}
                      {isCompressing
                        ? 'Processando...'
                        : queuedCount > 0
                        ? `Comprimir ${queuedCount} arquivo(s) · ${PRESETS[preset].label}`
                        : 'Todos processados'}
                    </button>
                  </div>

                  <div className="table-wrap">
                    <div className="table-scroll">
                      <table className="jobs">
                        <thead>
                          <tr>
                            <th>Arquivo</th>
                            <th>Original</th>
                            <th style={{ minWidth: 200 }}>Progresso</th>
                            <th>Final</th>
                            <th>%</th>
                            <th style={{ minWidth: 220 }}>Salvar como</th>
                            <th className="right">Ações</th>
                          </tr>
                        </thead>
                        <tbody>
                          {jobs.map((job) => {
                            const savings = job.result
                              ? calculateSavings(job.result.originalSize, job.result.compressedSize)
                              : 0;
                            const rowClass =
                              job.status === 'compressing' ? 'row-active'
                              : job.status === 'done' ? 'row-done'
                              : job.status === 'error' ? 'row-error'
                              : '';
                            return (
                              <tr key={job.id} className={rowClass}>
                                <td>
                                  <div className="cell-file">
                                    <div className={['job-icon', job.status].join(' ')}>
                                      {job.status === 'done' ? <I name="check" /> :
                                       job.status === 'error' ? <I name="alert" /> :
                                       job.status === 'compressing' ? <I name="loader" className="spin" /> :
                                       <I name="filetext" />}
                                    </div>
                                    <div className="job-name-wrap">
                                      <div className="job-name mono" title={job.originalName}>
                                        {job.originalName}
                                      </div>
                                      <div className="job-tags">
                                        <span className={['job-tag', job.status].join(' ')}>
                                          {job.status === 'queued' && 'na fila'}
                                          {job.status === 'compressing' && 'processando'}
                                          {job.status === 'done' && 'concluído'}
                                          {job.status === 'error' && 'erro'}
                                        </span>
                                      </div>
                                    </div>
                                  </div>
                                </td>
                                <td><span className="mono" style={{ fontSize: 14, color: '#f8f8f2' }}>{formatBytes(job.file.size)}</span></td>
                                <td>
                                  <div className="progress-wrap">
                                    <div className="progress-space progress-track">
                                      <div
                                        className={[
                                          'progress-fill',
                                          job.status === 'compressing' && 'shimmer',
                                          job.status === 'error' && 'error',
                                        ].filter(Boolean).join(' ')}
                                        style={{ width: `${job.progress.percent}%` }}
                                      />
                                    </div>
                                    <div className="progress-meta">
                                      <span className="progress-stage">{job.progress.stage}</span>
                                      <span className={[
                                        'progress-percent',
                                        job.status === 'done' && 'done',
                                        job.status === 'error' && 'error',
                                      ].filter(Boolean).join(' ')}>
                                        {job.progress.percent}%
                                      </span>
                                    </div>
                                    {job.status === 'error' && job.error && (
                                      <div className="progress-error-msg" title={job.error}>
                                        ⚠ {job.error}
                                      </div>
                                    )}
                                  </div>
                                </td>
                                <td>
                                  <span className="mono" style={{ fontSize: 14 }}>
                                    {job.result
                                      ? <span className="text-red">{formatBytes(job.result.compressedSize)}</span>
                                      : <span className="text-muted">—</span>}
                                  </span>
                                </td>
                                <td>
                                  <span className="mono" style={{ fontSize: 14 }}>
                                    {job.status === 'done' ? (
                                      <span className={
                                        savings >= 30 ? 'pill-green' :
                                        savings > 0 ? 'pill-yellow' : 'pill-gray'
                                      }>{savings}%</span>
                                    ) : <span className="text-muted">—</span>}
                                  </span>
                                </td>
                                <td>
                                  <div className="rename-wrap">
                                    <input
                                      type="text"
                                      className="rename-input"
                                      value={job.customName}
                                      onChange={(e) => handleCustomNameChange(job.id, e.target.value)}
                                      placeholder="renomeie-sem-espacos"
                                      disabled={job.status === 'compressing'}
                                    />
                                    <span className="rename-suffix">.pdf</span>
                                  </div>
                                </td>
                                <td>
                                  <div className="actions-wrap">
                                    <button
                                      className="btn-download"
                                      onClick={() => handleDownload(job)}
                                      disabled={job.status !== 'done' || !job.result}
                                      title={job.status === 'done' ? 'Baixar PDF comprimido' : 'Aguardando conclusão'}
                                    >
                                      <I name="download" />
                                      Baixar
                                    </button>
                                    <button
                                      className="btn-icon"
                                      onClick={() => handleRemoveJob(job.id)}
                                      disabled={isCompressing && job.status === 'compressing'}
                                      title="Remover da fila"
                                    >
                                      <I name="x" />
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {doneCount > 0 && (
                    <div className="stat-grid">
                      <div className="stat-card stat-a">
                        <div className="stat-label">Original total</div>
                        <div className="stat-value mono">{formatBytes(totalOriginal)}</div>
                      </div>
                      <div className="stat-card stat-b">
                        <div className="stat-label">Comprimido total</div>
                        <div className="stat-value red mono">{formatBytes(totalCompressed)}</div>
                      </div>
                      <div className="stat-card stat-c">
                        <div className="saving-head">
                          <div className="saving-title">
                            <I name="trendingdown" />
                            Economia global
                          </div>
                          <div className="saving-percent mono">{aggregateSavings}%</div>
                        </div>
                        <div className="saving-sub">
                          Menos {formatBytes(Math.max(0, totalOriginal - totalCompressed))} em tráfego/anexos
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </section>
            )}

            <section className="section">
              <div className="terminal-head">
                <span className="dot green" />
                <span className="dot yellow" />
                <span className="dot red" />
                <span className="terminal-title">rails_log — output terminal (múltiplos arquivos)</span>
              </div>
              <div ref={logContainerRef} className="terminal-log">
                {logs.length === 0 ? (
                  <div className="terminal-empty">
                    <p><span className="tag-ok">[INFO]</span> Aguardando upload de arquivos PDF (múltiplos aceitos)...</p>
                    <p><span style={{ color: '#bd93f9' }}>[TIP]</span> Arraste PDFs (vários de uma vez) ou clique na área acima.</p>
                    <p><span style={{ color: '#8be9fd' }}>[RENOMEAR]</span> Edite a coluna "Salvar como" na tabela antes de clicar em Baixar.</p>
                  </div>
                ) : (
                  <div>
                    {logs.map((log) => (
                      <p key={log.id} className={['terminal-line', log.type].join(' ')}>
                        {log.type === 'success' && <span className="tag-ok">[OK] </span>}
                        {log.type === 'error' && <span className="tag-err">[ERRO] </span>}
                        {log.type === 'warn' && <span className="tag-aviso">[AVISO] </span>}
                        {log.text}
                      </p>
                    ))}
                  </div>
                )}
              </div>
            </section>

            <footer className="footer">
              <p>
                Feito com <span className="footer-heart">♥</span> no Brasil · Processamento 100% local no seu navegador
              </p>
              <p className="footer-stack">
                <span className="tag-pdf-lib">pdf-lib</span> + <span className="tag-pdfjs">pdf.js</span> + React 18 · Tema Dracula + Ruby on Rails <span className="tag-ruby">#cc0000</span>
              </p>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
