name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: _deploy_standalone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: _deploy_standalone/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy public assets from portfolio artifacts (curriculo, mini-sites)
        run: |
          set -x
          SRC_PUBLIC="../artifacts/portfolio/public"
          DST_PUBLIC="./public"
          if [ -d "$SRC_PUBLIC" ]; then
            cp -vrf "$SRC_PUBLIC"/* "$DST_PUBLIC"/ 2>/dev/null || true
            ls -la "$DST_PUBLIC"
          else
            echo "[skip] artifacts/portfolio/public not found"
          fi

      - name: Build portfolio (BASE_PATH=/ for user GitHub Pages)
        env:
          BASE_PATH: /
          PORT: 4173
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -x
          npx vite build --config vite.config.ts 2>&1 | tail -80
          echo "=== Listing output ==="
          ls -la dist/public
          echo "=== HTML head check ==="
          head -c 600 dist/public/index.html || true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy_standalone/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
