name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Currículo PDF/HTML to portfolio public
        run: |
          [ -f curriculo.pdf ]  && cp curriculo.pdf  artifacts/portfolio/public/curriculo.pdf  || echo "[warn] curriculo.pdf não existe, pulando"
          [ -f curriculo.html ] && cp curriculo.html artifacts/portfolio/public/curriculo.html || echo "[warn] curriculo.html não existe, pulando"

      - name: Build portfolio
        run: |
          set -e
          echo "Listando node_modules/.bin do root:"
          ls -la node_modules/.bin/ 2>/dev/null | head -20 || echo "não tem node_modules/.bin root"
          echo "Listando node_modules/.bin do portfolio:"
          ls -la artifacts/portfolio/node_modules/.bin/ 2>/dev/null | head -20 || echo "não tem node_modules/.bin portfolio"
          echo "---"
          echo "Iniciando build do portfolio: cd artifacts/portfolio + PORT=3000 BASE_PATH=/ pnpm exec vite build --config vite.config.ts"
          cd artifacts/portfolio
          export PORT=3000
          export BASE_PATH=/
          pnpm exec vite build --config vite.config.ts 2>&1 | tee /tmp/build.log
          echo "---"
          echo "Fim do build. Verificando outDir artifacts/portfolio/dist/public:"
          ls -la dist/public 2>/dev/null || echo "[AVISO] dist/public não criado!"

      - name: Verify dist/public contents (pre-upload debug)
        run: |
          echo "=== CWD atual: ==="
          pwd
          echo "=== ls -la artifacts/portfolio: ==="
          ls -la artifacts/portfolio 2>/dev/null || echo "[ERROR] artifacts/portfolio não existe!"
          echo "=== ls -la artifacts/portfolio/dist: ==="
          ls -la artifacts/portfolio/dist 2>/dev/null || echo "[WARN] artifacts/portfolio/dist não existe!"
          echo "=== ls -la artifacts/portfolio/dist/public: ==="
          ls -laR artifacts/portfolio/dist/public 2>/dev/null | head -80 || echo "[ERROR] artifacts/portfolio/dist/public não existe!"
          echo "=== find -name index.html (root level): ==="
          find . -maxdepth 5 -name "index.html" -type f 2>/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/portfolio/dist/public

  deploy-pages:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
