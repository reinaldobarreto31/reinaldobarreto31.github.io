name: Deploy Portfolio to GitHub Pages (Run 142 ubuntu-22.04 actions v4 igual Runs 116-124 OK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Curriculo PDF/HTML
        run: |
          [ -f curriculo.pdf ]  && cp curriculo.pdf  artifacts/portfolio/public/curriculo.pdf  || echo "[warn] skip"
          [ -f curriculo.html ] && cp curriculo.html artifacts/portfolio/public/curriculo.html || echo "[warn] skip"

      - name: Build portfolio
        run: |
          set -e
          cd artifacts/portfolio
          export PORT=3000
          export BASE_PATH=/
          pnpm exec vite build --config vite.config.ts
          echo "=== ls -la dist/public:"
          ls -la dist/public

      - name: Deploy (peaceiris/actions-gh-pages@v4 - same as OK Runs 120-124)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/portfolio/dist/public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
