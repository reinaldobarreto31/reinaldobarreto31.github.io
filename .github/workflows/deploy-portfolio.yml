name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Currículo PDF/HTML to portfolio public
        run: |
          [ -f curriculo.pdf ]  && cp curriculo.pdf  artifacts/portfolio/public/curriculo.pdf  || echo "[warn] curriculo.pdf não existe, pulando"
          [ -f curriculo.html ] && cp curriculo.html artifacts/portfolio/public/curriculo.html || echo "[warn] curriculo.html não existe, pulando"

      - name: Build portfolio
        run: |
          set -e
          cd artifacts/portfolio
          export PORT=3000
          export BASE_PATH=/
          pnpm exec vite build --config vite.config.ts
          echo "=== ls -la dist/public:"
          ls -la dist/public
          echo "=== FIM BUILD OK ==="

      - name: Publish to gh-pages (shell script puro, sem actions Node)
        run: |
          set -e
          DIST_DIR="$GITHUB_WORKSPACE/artifacts/portfolio/dist/public"
          if [ ! -d "$DIST_DIR" ]; then
            echo "[ERRO FATAL] Pasta $DIST_DIR não encontrada. Build falhou?"
            exit 1
          fi
          if [ ! -f "$DIST_DIR/index.html" ]; then
            echo "[ERRO FATAL] $DIST_DIR/index.html não encontrado. Build não gerou index.html."
            exit 1
          fi
          echo "=== Iniciando deploy da pasta $DIST_DIR para branch gh-pages ==="
          cd "$DIST_DIR"
          echo "user.name=GitHub Actions" > $HOME/.gitconfig-ghpages
          git init -q
          git checkout -q -b gh-pages
          git add -A
          GIT_AUTHOR_NAME="github-actions[bot]"
          GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME="github-actions[bot]"
          GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
          git -c user.name="$GIT_AUTHOR_NAME" -c user.email="$GIT_AUTHOR_EMAIL" commit -q -m "Deploy GitHub Pages (commit ${{ github.sha }})

  Trabalho: ${{ github.workflow }}
  Disparado por: ${{ github.event_name }}
  SHA: ${{ github.sha }}"
          REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          echo "=== Pushando para gh-pages branch origin via token --force ==="
          git push --force --quiet "$REMOTE_URL" gh-pages:gh-pages
          echo "=== DEPLOY CONCLUÍDO COM SUCESSO (gh-pages branch) ==="
          echo "Acesse em 1-3 minutos: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
