name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Ruby curriculum to portfolio public
        continue-on-error: true
        run: |
          if [ -f curriculo.pdf ]; then
            cp curriculo.pdf artifacts/portfolio/public/curriculo.pdf
          else
            echo "curriculo.pdf not found — skipping"
          fi
          if [ -f curriculo.html ]; then
            cp curriculo.html artifacts/portfolio/public/curriculo.html
          else
            echo "curriculo.html not found — skipping"
          fi

      - name: Build workspace libraries
        run: pnpm run typecheck:libs

      - name: Typecheck portfolio
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/portfolio run typecheck

      - name: Build portfolio
        run: |
          set -x
          export PORT=3000
          export BASE_PATH=/
          pnpm --filter @workspace/portfolio run build > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          echo "Build exit code: ${BUILD_EXIT}"
          echo "::group::BUILD LOG (tail 200 lines)"
          tail -200 /tmp/build.log
          echo "::endgroup::"
          echo "::group::Find files in dist/public"
          find artifacts/portfolio/dist -maxdepth 3 -type f | sort | head -50
          echo "::endgroup::"
          if [ "${BUILD_EXIT}" != "0" ]; then
            echo "::error::Build failed with exit ${BUILD_EXIT}"
            exit ${BUILD_EXIT}
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/portfolio/dist/public
          publish_branch: gh-pages
